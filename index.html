<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>西罗亚音乐事工练习打卡系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i data-lucide="music" class="w-7 h-7"></i>
                <span class="font-bold text-lg tracking-wider">西罗亚音乐事工打卡</span>
            </div>
            <span id="db-status" class="bg-emerald-600 text-white px-2.5 py-1 rounded-full text-xs font-medium flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-white"></span>Firebase就绪
            </span>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto px-3 py-4 space-y-4 pb-20">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col sm:flex-row justify-between gap-3">
            <div class="flex items-center gap-2">
                <button id="prev-date" class="p-2 border rounded-lg text-slate-600"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <input type="date" id="current-date" class="px-3 py-2 border rounded-lg font-medium text-sm">
                <button id="next-date" class="p-2 border rounded-lg text-slate-600"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
            </div>
            <div class="flex items-center gap-2">
                <select id="grade-filter" class="px-3 py-2 border rounded-lg text-sm bg-white flex-1">
                    <option value="all">全部班级</option>
                    <option value="吉他入门班">吉他入门班</option>
                    <option value="吉他进阶班">吉他进阶班</option>
                    <option value="卡宏班">卡宏班</option>
                </select>
                <button onclick="openAddStudentModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-1 shadow-sm">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>添加学员
                </button>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm text-center">
                <div class="text-xs text-slate-500 mb-1">总学员数</div>
                <div id="stat-total" class="text-xl font-bold text-slate-800">0</div>
            </div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm text-center">
                <div class="text-xs text-slate-500 mb-1">今日打卡</div>
                <div id="stat-checked" class="text-xl font-bold text-indigo-600">0</div>
            </div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm text-center">
                <div class="text-xs text-slate-500 mb-1">打卡率</div>
                <div id="stat-rate" class="text-xl font-bold text-emerald-600">0%</div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <h2 class="font-bold text-slate-800 text-sm">学员打卡清单</h2>
                <span class="text-xs text-slate-400">点击打卡状态可切换</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs border-b border-slate-100">
                            <th class="p-3">姓名</th>
                            <th class="p-3">班级</th>
                            <th class="p-3 text-center">今日状态</th>
                            <th class="p-3">练习时长/内容</th>
                            <th class="p-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="text-center py-6 text-slate-400">正在从 Firebase 加载数据...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
                <h3 class="font-bold text-slate-800 text-sm mb-3">本期积分排行榜</h3>
                <div id="ranking-list" class="space-y-2.5">
                    <div class="text-center py-4 text-slate-400 text-sm">暂无排名数据</div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-slate-800 text-sm">老师授课/练习日志</h3>
                    <button onclick="saveLog()" class="text-xs bg-indigo-50 text-indigo-600 font-medium px-2.5 py-1 rounded">保存日志</button>
                </div>
                <textarea id="teacher-log" placeholder="记录今天各班级授课重点、作业布置或注意事项..." class="w-full flex-1 min-h-[120px] p-3 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
            </div>
        </div>
    </main>

    <div id="add-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800">添加新学员</h3>
                <button onclick="closeAddStudentModal()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">学员姓名</label>
                    <input type="text" id="new-name" placeholder="请输入姓名" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">所属班级</label>
                    <select id="new-grade" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                        <option value="吉他入门班">吉他入门班</option>
                        <option value="吉他进阶班">吉他进阶班</option>
                        <option value="卡宏班">卡宏班</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeAddStudentModal()" class="px-4 py-2 border rounded-lg text-sm text-slate-600">取消</button>
                <button onclick="confirmAddStudent()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium">确认添加</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const firebaseConfig = {
            apiKey: "AIzaSyBynkVXq6oLYyYAGJ9CMDgCQRHWsJ1IJU0",
            authDomain: "siloam-music.firebaseapp.com",
            projectId: "siloam-music",
            storageBucket: "siloam-music.appspot.com",
            messagingSenderId: "53599364892",
            appId: "1:53599364892:web:e2e2973d586655b0487cd9"
        };

        const API_BASE = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents`;

        let studentsData = [], checkinsData = [], currentLogId = null;
        const dateInput = document.getElementById('current-date');
        dateInput.value = new Date().toISOString().split('T')[0];

        function parseFirestoreDocs(data) {
            if (!data.documents) return [];
            return data.documents.map(doc => {
                const id = doc.name.split('/').pop();
                const fields = {};
                for (const key in doc.fields) {
                    fields[key] = doc.fields[key].stringValue || doc.fields[key].booleanValue || doc.fields[key].integerValue || doc.fields[key].doubleValue;
                }
                fields._id = id;
                return fields;
            });
        }

        async function loadAllData() {
            try {
                const sRes = await fetch(`${API_BASE}/students`);
                const sJson = await sRes.json();
                studentsData = parseFirestoreDocs(sJson);

                await loadDateData();
            } catch (err) {
                console.error("加载失败", err);
                document.getElementById('db-status').className = 'bg-rose-500 text-white px-2.5 py-1 rounded-full text-xs font-medium flex items-center gap-1';
                document.getElementById('db-status').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-white"></span>连接失败';
            }
        }

        async function loadDateData() {
            const dateVal = dateInput.value;
            try {
                const cRes = await fetch(`${API_BASE}/checkins`);
                const cJson = await cRes.json();
                const allCheckins = parseFirestoreDocs(cJson);
                checkinsData = allCheckins.filter(c => c.date === dateVal);

                const lRes = await fetch(`${API_BASE}/lesson_logs`);
                const lJson = await lRes.json();
                const allLogs = parseFirestoreDocs(lJson);
                const todayLog = allLogs.find(l => l.date === dateVal);

                if (todayLog) {
                    document.getElementById('teacher-log').value = todayLog.content || '';
                    currentLogId = todayLog._id;
                } else {
                    document.getElementById('teacher-log').value = '';
                    currentLogId = null;
                }

                renderUI();
            } catch (err) {
                console.error("加载日期数据失败", err);
            }
        }

        function renderUI() {
            const gradeFilter = document.getElementById('grade-filter').value;
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';
            let filtered = gradeFilter === 'all' ? studentsData : studentsData.filter(s => s.grade === gradeFilter);
            let checkedCount = 0;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">暂无该班级学员</td></tr>`;
                return;
            }

            filtered.forEach(student => {
                const checkin = checkinsData.find(c => c.studentId === student._id || c.name === student.name);
                const isChecked = checkin ? checkin.status : false;
                const note = checkin && checkin.note ? checkin.note : '';
                if (isChecked) checkedCount++;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80';
                tr.innerHTML = `
                    <td class="p-3 font-medium text-slate-800">${student.name}</td>
                    <td class="p-3 text-slate-500"><span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs">${student.grade}</span></td>
                    <td class="p-3 text-center">
                        <button onclick="toggleCheckin('${student._id}', '${student.name}', ${isChecked})" class="px-3 py-1 rounded-full text-xs font-medium ${isChecked ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">
                            ${isChecked ? '✓ 已打卡' : '未打卡'}
                        </button>
                    </td>
                    <td class="p-3">
                        <input type="text" value="${note}" onblur="updateNote('${student._id}', '${student.name}', this.value)" placeholder="填写时长..." class="w-full px-2 py-1 text-xs border rounded bg-transparent">
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="deleteStudent('${student._id}')" class="text-slate-400 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-total').innerText = studentsData.length;
            document.getElementById('stat-checked').innerText = checkedCount;
            document.getElementById('stat-rate').innerText = (studentsData.length ? Math.round((checkedCount / studentsData.length) * 100) : 0) + '%';
            renderRanking();
            lucide.createIcons();
        }

        async function toggleCheckin(studentId, name, currentStatus) {
            const dateVal = dateInput.value;
            const existing = checkinsData.find(c => c.studentId === studentId || c.name === name);
            const newStatus = !currentStatus;

            try {
                if (existing) {
                    await fetch(`${API_BASE}/checkins/${existing._id}?updateMask.fieldPaths=status`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fields: { status: { booleanValue: newStatus } } })
                    });
                } else {
                    await fetch(`${API_BASE}/checkins`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            fields: {
                                studentId: { stringValue: studentId },
                                name: { stringValue: name },
                                date: { stringValue: dateVal },
                                status: { booleanValue: true },
                                note: { stringValue: "" }
                            }
                        })
                    });
                }
                await loadDateData();
            } catch (e) { console.error(e); }
        }

        async function updateNote(studentId, name, noteVal) {
            const dateVal = dateInput.value;
            const existing = checkinsData.find(c => c.studentId === studentId || c.name === name);
            try {
                if (existing) {
                    await fetch(`${API_BASE}/checkins/${existing._id}?updateMask.fieldPaths=note`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fields: { note: { stringValue: noteVal } } })
                    });
                } else {
                    await fetch(`${API_BASE}/checkins`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            fields: {
                                studentId: { stringValue: studentId },
                                name: { stringValue: name },
                                date: { stringValue: dateVal },
                                status: { booleanValue: false },
                                note: { stringValue: noteVal }
                            }
                        })
                    });
                }
            } catch (e) { console.error(e); }
        }

        async function renderRanking() {
            try {
                const res = await fetch(`${API_BASE}/checkins`);
                const json = await res.json();
                const all = parseFirestoreDocs(json);
                const counts = {};
                all.forEach(c => { if (c.status) counts[c.name] = (counts[c.name] || 0) + 1; });
                const sorted = Object.keys(counts).map(name => ({ name, count: counts[name] })).sort((a, b) => b.count - a.count).slice(0, 5);
                const rankList = document.getElementById('ranking-list');
                rankList.innerHTML = sorted.length ? '' : `<div class="text-center py-4 text-slate-400 text-sm">暂无排名数据</div>`;
                sorted.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center p-2 rounded-lg bg-slate-50 text-sm';
                    div.innerHTML = `<div class="flex items-center gap-2"><span class="w-5 h-5 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-xs font-bold">${index + 1}</span><span>${item.name}</span></div><span class="text-indigo-600 font-bold text-xs">${item.count}次</span>`;
                    rankList.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        async function saveLog() {
            const dateVal = dateInput.value;
            const content = document.getElementById('teacher-log').value;
            try {
                if (currentLogId) {
                    await fetch(`${API_BASE}/lesson_logs/${currentLogId}?updateMask.fieldPaths=content`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fields: { content: { stringValue: content } } })
                    });
                } else {
                    const res = await fetch(`${API_BASE}/lesson_logs`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            fields: {
                                date: { stringValue: dateVal },
                                content: { stringValue: content }
                            }
                        })
                    });
                    const json = await res.json();
                    currentLogId = json.name.split('/').pop();
                }
                alert('日志保存成功！');
            } catch (e) { alert('保存失败'); }
        }

        function openAddStudentModal() { document.getElementById('add-modal').classList.remove('hidden'); }
        function closeAddStudentModal() { document.getElementById('add-modal').classList.add('hidden'); }

        async function confirmAddStudent() {
            const name = document.getElementById('new-name').value.trim();
            const grade = document.getElementById('new-grade').value;
            if (!name) return alert('请输入姓名');
            try {
                await fetch(`${API_BASE}/students`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fields: {
                            name: { stringValue: name },
                            grade: { stringValue: grade }
                        }
                    })
                });
                closeAddStudentModal();
                document.getElementById('new-name').value = '';
                await loadAllData();
            } catch (e) { console.error(e); }
        }

        async function deleteStudent(id) {
            if (!confirm('确定删除吗？')) return;
            try {
                await fetch(`${API_BASE}/students/${id}`, { method: 'DELETE' });
                await loadAllData();
            } catch (e) { console.error(e); }
        }

        document.getElementById('grade-filter').addEventListener('change', renderUI);
        dateInput.addEventListener('change', loadDateData);
        document.getElementById('prev-date').addEventListener('click', () => {
            const d = new Date(dateInput.value); d.setDate(d.getDate() - 1);
            dateInput.value = d.toISOString().split('T')[0]; loadDateData();
        });
        document.getElementById('next-date').addEventListener('click', () => {
            const d = new Date(dateInput.value); d.setDate(d.getDate() + 1);
            dateInput.value = d.toISOString().split('T')[0]; loadDateData();
        });

        window.addEventListener('DOMContentLoaded', loadAllData);
    </script>
</body>
</html>
